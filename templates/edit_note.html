{% extends "base.html" %}

{% block title %}
Edit Note - SNS
{% endblock %}

{% block content %}
<div class="add-note-container">
    <h1>Edit Note</h1>

    <form method="POST" action="/notes/{{ note.id }}/edit" class="add-note-form">
        <div class="form-group">
            <label for="title">Title</label>
            <input 
                type="text" 
                id="title" 
                name="title" 
                value="{{ note.title }}" 
                required>
        </div>

        <div class="form-group">
            <label for="content">Content</label>
            <textarea 
                id="content" 
                name="content" 
                rows="6" 
                required>{{ note.content }}</textarea>
        </div>

        <button type="submit">Update Note</button>
    </form>

    {% if err %}
        <p style="color:red;">{{ err }}</p>
    {% endif %}
</div>
{% endblock %}
