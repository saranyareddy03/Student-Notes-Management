{% extends "base.html" %}

{% block title %}
Edit Note - SNS
{% endblock %}

{% block navmenu %}
<a href="{{ url_for('my_notes') }}">My Notes</a>
<a href="{{ url_for('dashboard') }}">Dashboard</a>
{% endblock %}

{% block content %}
<div class="add-note-container">
    <h1>Edit Note</h1>

    {% if err %}
        <p class="form-error">{{ err }}</p>
    {% endif %}

    <form method="POST"
          action="{{ url_for('edit_note', note_id=note.id) }}"
          class="add-note-form">

        <div class="form-group">
            <label for="title">Title</label>
            <input type="text"
                   id="title"
                   name="title"
                   value="{{ note.title }}"
                   required>
        </div>

        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content"
                      name="content"
                      rows="12"
                      required>{{ note.content }}</textarea>
            <small class="form-help">
                Line breaks and bullet points will be preserved.
            </small>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('my_notes') }}" class="btn btn-secondary">
                Cancel
            </a>
            <button type="submit" class="btn btn-primary">
                Update Note
            </button>
        </div>
    </form>
</div>
{% endblock %}
