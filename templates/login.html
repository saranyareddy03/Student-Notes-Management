{% extends "base.html" %}


{% block title %}
Login - SNS
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Login</h1>

    <p class="form-subtitle">
        Login to access your notes.
    </p>


    <form
        method="POST"
        action="{{ url_for('login') }}"
    >

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >

        </div>


        <button
            type="submit"
            class="btn btn-primary full-width"
        >
            Login
        </button>

    </form>


    <p class="form-footer">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Register
        </a>

    </p>

</div>

{% endblock %}
