<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        SNS
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<header class="main-header">

    <div class="container navbar">

        <h2 class="logo">
            STUDENT NOTES MANAGEMENT
        </h2>

        <nav>
           
            {% block navmenu %}
            {% endblock %}
        </nav>

    </div>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<footer class="footer">

    <p>
        Student Notes System | Codegnan
    </p>

</footer>

</body>
</html>
