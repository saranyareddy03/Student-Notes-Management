{% extends "base.html" %}

{% block title %}
Verify - SNS
{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Verify Account</h1>
    <p class="form-subtitle">
        VErify to start managing your notes.
    </p>
    <form
        method="POST"
        action="{{ url_for('verify') }}"
    >
        <div class="form-group">
            <label for="otp">
            </label>
            <input
                type="text"
                id="name"
                name="otp"
                placeholder="Enter your OTP"
                required
            >
        </div>
        <button
            type="submit"
            class="btn btn-primary full-width"
        >
            Register
        </button>
    </form>
</div>

{% endblock %}
