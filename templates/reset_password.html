{% extends "base.html" %}

{% block title %}
Reset Password - SNS
{% endblock %}

{% block navmenu %}
<a href="{{ url_for('home') }}">Home</a>
<a href="{{ url_for('login') }}">Login</a>
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Reset Password</h1>

    <form method="POST">

        <div class="form-group">

            <label for="new_password">
                New Password
            </label>

            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter new password"
                required
            >

        </div>

        <div class="form-group">

            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm new password"
                required
            >

        </div>

        <button
            type="submit"
            class="btn btn-primary full-width"
        >
            Reset Password
        </button>

        <br>

        {% if err %}
            <span style="color:red">{{ err }}</span>
        {% endif %}

    </form>

</div>

{% endblock %}
